[package]
name = "hermes-workspace-desktop"
version = "0.1.0"
description = "Hermes Workspace Desktop App"
authors = ["Hermes Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = "4.1.5"
tauri-plugin-dialog = "2"
uuid = "1.18"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
